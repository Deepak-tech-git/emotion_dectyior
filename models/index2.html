<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2430;
    --muted: #5d6877;
    --paper: #eef1f5;
    --panel: #ffffff;
    --tint: #c9d2de;          /* changes with the detected emotion */
    --tint-ink: #1b2430;
    --font: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--paper);
    transition: background-color .6s ease;
    line-height: 1.5;
  }
  body.has-result { background: color-mix(in srgb, var(--tint) 22%, var(--paper)); }

  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 72px; }

  h1 {
    font-size: clamp(2.4rem, 7vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.02;
    margin: 0 0 14px;
  }
  .lede { color: var(--muted); font-size: 1.1rem; max-width: 46ch; margin: 0 0 36px; }

  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical;
    font: inherit; font-size: 1.15rem; color: var(--ink);
    background: var(--panel);
    border: 2px solid transparent; border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 1px 0 rgba(27,36,48,.08);
    transition: border-color .2s;
  }
  textarea:focus-visible { outline: none; border-color: var(--ink); }

  .row { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  button.primary {
    font: inherit; font-weight: 600; font-size: 1.05rem;
    background: var(--ink); color: #fff;
    border: 0; border-radius: 999px; padding: 13px 28px; cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: progress; }
  button:focus-visible, .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .count { color: var(--muted); font-size: .9rem; margin-left: auto; }

  .examples { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: .92rem; color: var(--ink);
    background: transparent; border: 1.5px solid rgba(27,36,48,.25);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .chip:hover { border-color: var(--ink); }

  .error { color: #a12626; font-weight: 600; margin-top: 16px; min-height: 1.5em; }

  #result { margin-top: 36px; display: none; }
  #result.show { display: block; animation: rise .5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .verdict {
    background: var(--tint); color: var(--tint-ink);
    border-radius: 22px; padding: 28px 30px;
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  }
  .verdict .face { font-size: 4rem; line-height: 1; }
  .verdict .name { font-size: clamp(2.2rem, 8vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; text-transform: capitalize; line-height: 1; }
  .verdict .conf { font-size: 1.05rem; margin-top: 6px; opacity: .85; }

  .bars { margin: 26px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .bars li { display: grid; grid-template-columns: 96px 1fr 58px; align-items: center; gap: 12px; }
  .bars .lbl { text-transform: capitalize; font-weight: 600; }
  .bars .track { height: 12px; background: rgba(27,36,48,.1); border-radius: 999px; overflow: hidden; }
  .bars .fill { height: 100%; width: 0; border-radius: 999px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .bars .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

  footer { margin-top: 56px; color: var(--muted); font-size: .88rem; }

  @media (max-width: 480px) { .bars li { grid-template-columns: 78px 1fr 50px; } }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>What is this sentence feeling?</h1>
  <p class="lede">Type or paste any English sentence. The model reads it and tells you which emotion it carries, and how sure it is.</p>

  <label for="text">Your sentence</label>
  <textarea id="text" maxlength="1000" placeholder="I can't believe how well the presentation went today."></textarea>

  <div class="row">
    <button id="go" class="primary" type="button">Detect emotion</button>
    <span class="count" id="count">0 / 1000</span>
  </div>

  <div class="examples" aria-label="Example sentences">
    <button class="chip" type="button">I am so happy today!</button>
    <button class="chip" type="button">I feel sad and lonely.</button>
    <button class="chip" type="button">I am extremely angry with him.</button>
    <button class="chip" type="button">I am scared about what will happen.</button>
  </div>

  <div class="error" id="error" role="alert"></div>

  <section id="result" aria-live="polite">
    <div class="verdict" id="verdict">
      <div class="face" id="face"></div>
      <div>
        <div class="name" id="name"></div>
        <div class="conf" id="conf"></div>
      </div>
    </div>
    <ul class="bars" id="bars"></ul>
  </section>

  <footer>Logistic Regression + TF-IDF · test accuracy {{ accuracy }}%</footer>
</main>

<script src="app.js" defer></script>
</body>
</html>
